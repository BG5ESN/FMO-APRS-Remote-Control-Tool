[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fmo-aprs"
version = "0.1.0"
description = "FMO remote control via APRS-IS with HMAC authentication"
readme = "README.md"
authors = [
    {name = "BG5ESN"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["aprs", "ham-radio", "amateur-radio", "fmo", "remote-control", "hmac"]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/BG5ESN/FMO-APRS-Remote-Control-Tool"
Repository = "https://github.com/BG5ESN/FMO-APRS-Remote-Control-Tool"
Issues = "https://github.com/BG5ESN/FMO-APRS-Remote-Control-Tool/issues"

[tool.setuptools]
packages = ["fmo_aprs"]

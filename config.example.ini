# Configuration Example for FMO-APRS

# APRS-IS Configuration
[aprs]
# Your amateur radio callsign
callsign = N0CALL

# APRS-IS passcode for your callsign
# Get your passcode from: https://apps.magicbug.co.uk/passcode/
# Use -1 for receive-only operation
passcode = 12345

# APRS-IS server (optional, defaults to rotate.aprs2.net)
server = rotate.aprs2.net

# APRS-IS port (optional, defaults to 14580)
port = 14580

# FMO Configuration
[fmo]
# Target FMO callsign
target_callsign = FMO-1

# Shared secret for HMAC authentication
# IMPORTANT: Keep this secret! Generate with:
# python3 -c "import secrets; print(secrets.token_urlsafe(32))"
shared_secret = your-secret-key-here

# Time window for command validity in seconds (default: 300)
time_window = 300

# Logging Configuration
[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# Log file (optional, leave empty for console only)
log_file = 

# Commands Configuration
[commands]
# Enable/disable specific command handlers
enable_status = true
enable_frequency = true
enable_power = true

# Command rate limiting (commands per minute)
rate_limit = 10
